<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reports</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="main-content">

<header>

<h1>📄 Water Quality Reports</h1>

<p>AI Smart Water Surveillance System</p>

</header>

<div class="summary-cards">

<div class="summary-card">
<h3>Total Reports</h3>
<h1>25</h1>
</div>

<div class="summary-card">
<h3>Today's Reports</h3>
<h1>3</h1>
</div>

<div class="summary-card">
<h3>Safe Reports</h3>
<h1>22</h1>
</div>

<div class="summary-card">
<h3>Unsafe Reports</h3>
<h1>3</h1>
</div>

</div>

<div class="card">

<h2>📋 Report History</h2>

<table class="report-table">

<thead>

<tr>
<th>Date</th>
<th>Tank</th>
<th>Health</th>
<th>Status</th>
<th>Report</th>
</tr>

</thead>

<tbody>

<tr>
<td>31-07-2026</td>
<td>Main Tank</td>
<td>98%</td>
<td style="color:lime;">SAFE</td>
<td><button>Download</button></td>
</tr>

<tr>
<td>30-07-2026</td>
<td>Main Tank</td>
<td>96%</td>
<td style="color:lime;">SAFE</td>
<td><button>Download</button></td>
</tr>

<tr>
<td>29-07-2026</td>
<td>Main Tank</td>
<td>68%</td>
<td style="color:red;">UNSAFE</td>
<td><button>Download</button></td>
</tr>

</tbody>

</table>

</div>

</div>

<script src="reports.js"></script>

</body>
</html>
