<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Settings</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

body{
    margin:0;
    background:#0f172a;
    color:white;
    font-family:Arial,sans-serif;
}

.container{
    width:90%;
    max-width:1000px;
    margin:40px auto;
}

h1{
    text-align:center;
    margin-bottom:40px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:25px;
}

.card{
    background:#1e293b;
    border:2px solid #0ea5e9;
    border-radius:12px;
    padding:25px;
    text-align:center;
    transition:.3s;
}

.card:hover{
    transform:translateY(-5px);
    box-shadow:0 0 15px #0ea5e9;
}

.card i{
    font-size:35px;
    color:#38bdf8;
    margin-bottom:15px;
}

button{
    margin-top:15px;
    padding:10px 18px;
    border:none;
    border-radius:8px;
    background:#0ea5e9;
    color:white;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    background:#0284c7;
}

.setting-card{

    margin-top:40px;
    text-align:center;

}

.back{

    display:block;
    width:180px;
    margin:40px auto;

}

/* Toggle Switch */

.switch{

    position:relative;
    display:inline-block;
    width:60px;
    height:34px;

}

.switch input{

    opacity:0;
    width:0;
    height:0;

}

.slider{

    position:absolute;
    cursor:pointer;
    top:0;
    left:0;
    right:0;
    bottom:0;
    background:#666;
    transition:.4s;
    border-radius:34px;

}

.slider:before{

    position:absolute;
    content:"";
    height:26px;
    width:26px;
    left:4px;
    bottom:4px;
    background:white;
    transition:.4s;
    border-radius:50%;

}

input:checked + .slider{

    background:#0ea5e9;

}

input:checked + .slider:before{

    transform:translateX(26px);

}

.dark-mode{

    background:#111827;

}

.dark-mode .card{

    background:#374151;

}

</style>

</head>

<body>

<div class="container">

<h1>⚙️ Settings</h1>

<div class="grid">

<div class="card">

<i class="fa-solid fa-user"></i>

<h3>Profile</h3>

<p>Administrator</p>

<button id="profileBtn">Edit</button>

</div>

<div class="card">

<i class="fa-solid fa-bell"></i>

<h3>Notifications</h3>

<p>Manage Alerts</p>

<button id="notificationBtn">Configure</button>

</div>

<div class="card">

<i class="fa-solid fa-wifi"></i>

<h3>Wi-Fi</h3>

<p>ESP32 Connection</p>

<button id="wifiBtn">Settings</button>

</div>

<div class="card">

<i class="fa-solid fa-database"></i>

<h3>Database</h3>

<p>Firebase Connected</p>

<button id="databaseBtn">View</button>

</div>

<div class="card">

<i class="fa-solid fa-circle-info"></i>

<h3>About Project</h3>

<p>AI Smart Water Surveillance System</p>

<button id="aboutBtn">Details</button>

</div>

<div class="card">

<i class="fa-solid fa-right-from-bracket"></i>

<h3>Logout</h3>

<p>Exit Dashboard</p>

<button id="logoutBtn">Logout</button>

</div>

</div>

<div class="setting-card">

<h3>🌙 Dark Mode</h3>

<label class="switch">

<input type="checkbox" id="themeToggle">

<span class="slider"></span>

</label>

</div>

<button class="back" id="backBtn">

⬅ Back to Dashboard

</button>

</div>

<script src="settings.js"></script>

</body>

</html>
